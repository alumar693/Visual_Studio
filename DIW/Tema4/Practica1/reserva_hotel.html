<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Reserva - Hotel Paradiso</title>
    <link rel="stylesheet" href="styles/reserva_hotel.css">
</head>
<body>
    <h1>Reserva tu habitación en Hotel Paradiso</h1>
    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" class="writable" placeholder="Introduce tu nombre completo" required>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" class="writable" placeholder="Introduce tu correo electrónico" required>
        
        <label for="telefono">Teléfono de contacto:</label>
        <input type="tel" id="telefono" class="writable" placeholder="Introduce tu número de teléfono" required>
        
        <label for="fecha_llegada">Fecha de llegada:</label>
        <input type="date" id="fecha_llegada" min="2024-11-21" required>
        
        <label for="fecha_salida">Fecha de salida:</label>
        <input type="date" id="fecha_salida" required>
        
        <label for="tipo_habitacion">Tipo de habitación:</label>
        <select id="tipo_habitacion">
            <option value="text">Habitación Individual</option>
            <option value="text">Habitación Doble</option>
            <option value="text">Suite</option>
        </select>
        
        <label for="número_huéspedes">Número de huéspedes:</label>
        <input type="number" id="número_huéspedes" class="writable" required min="1" max="10">
        
        <label for="hora_llegada">Hora de llegada:</label>
        <input type="time" id="hora_llegada" class="writable">
        <fieldset>
            <legend>Servicios adicionales:</legend>
            <label><input type="checkbox" name="servicios" value="desayuno"> Desayuno incluido</label>
            <label><input type="checkbox" name="servicios" value="wifi"> Aparcamiento incluido</label>
            <label><input type="checkbox" name="servicios" value="parking"> Cama supletoria</label>
        </fieldset>
        
        <label for="comentarios_adicionales">Comentarios adicionales: </label>
        <textarea id="comentarios_adicionales" class="writable"></textarea>
        
        <label for="color_preferido">Color preferido para la decoración:</label>
        <select id="color_preferido" name="color_preferido">
            <option value="">Seleccionar un color</option>
            <option value="beige">Beige</option>
            <option value="lightblue">Azul claro</option>
            <option value="lightgray">Gris suave</option>
            <option value="white">Blanco</option>
            <option value="mintgreen">Verde menta</option>
        </select>
        
        <label for="politica_privacidad">Política de privacidad</label>
        <input type="checkbox" id="politica_privacidad" required>
        
        <label for="submit">Confirmar Reserva</label>
        <input type="submit" id="submit">
    </form>
</body>
</html>
