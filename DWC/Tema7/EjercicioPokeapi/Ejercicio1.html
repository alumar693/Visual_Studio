<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Pokémon</title>
    <!-- Incluir jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Lista de Pokémon</h1>
    <table id="pokemonTable">
        <thead>
            <tr>
                <th>Pokémon</th>
                <th>URL</th>
            </tr>
        </thead>
        <tbody>
            <!-- Aquí se insertarán las filas con jQuery -->
        </tbody>
    </table>

    <script>
        $(document).ready(function () {
            // URL de la PokeAPI
            const apiUrl = "https://pokeapi.co/api/v2/pokemon/";

            // Función para obtener los datos de los Pokémon
            function fetchPokemonData() {
                $.get(apiUrl, function (data) {
                    // Recorrer la lista de Pokémon
                    data.results.forEach(function (pokemon) {
                        // Crear una nueva fila en la tabla
                        const row = `<tr>
                                        <td>${pokemon.name}</td>
                                        <td>${pokemon.url}</td>
                                    </tr>`;
                        // Añadir la fila al cuerpo de la tabla
                        $("#pokemonTable tbody").append(row);
                    });
                }).fail(function () {
                    alert("Error al cargar los datos de la PokeAPI.");
                });
            }

            // Llamar a la función para cargar los datos
            fetchPokemonData();
        });
    </script>
</body>
</html>
